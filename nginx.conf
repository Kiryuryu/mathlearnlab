# Nginx production configuration for MathLearnLab
# Place at /etc/nginx/conf.d/mathlearnlab.conf

upstream fastapi {
    server 127.0.0.1:8000;
}

# ── Compression ──
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml
           image/svg+xml application/manifest+json text/markdown;

server {
    listen 80;
    server_name mathlearnlab.cn www.mathlearnlab.cn 8.137.78.250;

    # Max upload for OCR images
    client_max_body_size 10M;

    # ── Vue SPA build (hashed assets are immutable) ──
    root /opt/apps/mathlearnlab/static-spa;
    index index.html;

    # Hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API & data — proxy to FastAPI ──
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /data/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── SPA history-mode fallback: unknown paths → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
